name = "ustozim-quiz-bot"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "SESSIONS"
id = "ebd0009c51a4474093d544fa77ee07ed"

[vars]
GROUP_URL = "https://t.me/ustozimnurimco"
BOT_USERNAME = "ustozimnurimbot"
CHAT_ID = "-1001920805324"
ADMIN_ID = "1272696340"
# Kitob marafoni kanali
CHANNEL_ID = "@sahifalarUstozimnurim"
KITOB_START = "2026-08-08"
WEBHOOK_URL = "https://ustozim-quiz-bot.nuriddinovx2.workers.dev/"

# Cron — Toshkent vaqti UTC+5
#   15:00 UTC = 20:00 Toshkent → guruhga kunlik viktorina e'loni
#   16:00 UTC = 21:00 Toshkent → kanalga kunlik fasl + eslatma
#   17:00 UTC = 22:00 Toshkent → guruhga kunlik reyting
#   18:00 UTC = 23:00 Toshkent → kanalga kunlik reyting
[triggers]
crons = ["0 15 * * *", "0 16 * * *", "0 17 * * *", "0 18 * * *"]

# Maxfiy qiymatlar (BOT_TOKEN, WEBHOOK_SECRET) bu faylda saqlanmaydi:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
